name: API Smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-groups

      - name: Run API regression smoke suite
        run: make test-api-smoke
