[project]
name = "storage-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "swm-common",
  "swm-redis",
  "swm-models",
  "swm-clickhouse",
  "swm-db"
]

[project.scripts]
storage-worker = "storage_worker.main:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_worker"]
