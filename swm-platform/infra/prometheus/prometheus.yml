global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: ingestion_api
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-api:8001"]

  - job_name: websocket_api
    metrics_path: /metrics
    static_configs:
      - targets: ["websocket-api:8002"]

  - job_name: admin_api
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-api:8003"]

  - job_name: realtime_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["realtime-worker:9101"]

  - job_name: storage_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["storage-worker:9102"]

  - job_name: analytics_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-worker:9103"]

  - job_name: alert_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-worker:9104"]
