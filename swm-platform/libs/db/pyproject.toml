[project]
name = "swm-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "swm-common",
  "swm-schemas"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swm_db"]
