[project]
name = "swm-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "orjson>=3.10.16",
  "prometheus-client>=0.21.1",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.8.1",
  "structlog>=25.2.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swm_common"]
